# ============================================================================
# 高可靠交易与对账系统 —— Docker Compose 编排
#
# 两种用法（CLAUDE.md 3.1）：
#   1. 日常开发（推荐）：只拉中间件，app 在 Dev Container 内编译运行
#        docker compose up -d mysql redis rabbitmq
#   2. 一键部署演示：连 app 一起拉起（首次构建约 10~20 分钟）
#        docker compose up -d --build
#
# ⚠️ 改了 sql/ 后要 docker compose down -v 清卷重建：
#    /docker-entrypoint-initdb.d 的初始化脚本只在数据卷为空时执行一次。
# ============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: trade-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      # 必须设置：app 从宿主机网关(host.docker.internal)连进来，默认的
      # root@localhost 不匹配 → Access denied（2026-09-13 实踩，事务连接超时）。
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai            # CLAUDE.md 6.7：容器默认 UTC 会让对账错位一天
    command:
      - --default-time-zone=+8:00  # 会话时区：与 app 侧 TZ 对齐（修正 3 的前提）
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 宿主 3306 被原生 MySQL 占用(2026-09-13 实测,PID 监听 127.0.0.1:3306)，
      # 且 host.docker.internal 会转发到宿主回环 → 撞上原生服务。改映射 3307。
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d   # schema.sql + seed.sql，卷初始化时执行一次
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    container_name: trade-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: trade-rabbitmq
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      # 宿主 5672/15672 被原生服务占用（2026-09-13 实测，PID 19888 同时监听
      # 3306/5672/15672），Docker Desktop 冲突时容器照跑但映射静默失效。改 5673/15673。
      - "5673:5672"      # AMQP（config.json 的 rabbitmq.port 已改 5673）
      - "15673:15672"    # 管理台 http://localhost:15673
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  # 一键部署演示用。日常开发不需要（app 在 Dev Container 内运行）。
  # ⚠️ 待办：当前 config/config.json 的中间件 host 是 host.docker.internal
  #    （Dev Container 模式），在 compose 网络内会解析错 —— 一键部署模式上线前
  #    需要换成服务名（config.compose.json 或环境覆盖），收尾阶段解决。
  app:
    build: .
    image: trade-server:latest
    container_name: trade-app
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
