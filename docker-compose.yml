# 中间件编排。日常开发:docker compose up -d mysql redis rabbitmq
# 一键部署演示(连 app 一起):docker compose up -d --build
# 注意:改了 sql/ 后要 docker compose down -v 清卷重建,
# 初始化脚本只在数据卷为空时执行一次。

services:
  mysql:
    image: mysql:8.0
    container_name: trade-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      # app 从宿主机网关(host.docker.internal)连进来,需要 root@'%'
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    command:
      - --default-time-zone=+8:00  # 会话时区,与应用侧 UTC+8 对齐
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 宿主 3306 被本机原生 MySQL 占用,且 host.docker.internal 会转发到
      # 宿主回环撞上它,所以映射到 3307。
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d   # schema.sql + seed.sql,卷初始化时执行一次
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    container_name: trade-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: trade-rabbitmq
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      # 宿主 5672/15672 同样被本机原生服务占用(Docker Desktop 端口冲突时
      # 容器照跑、映射静默失效),改映射 5673/15673。
      - "5673:5672"      # AMQP(config.json 的 rabbitmq.port 已改 5673)
      - "15673:15672"    # 管理台 http://localhost:15673
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  # 一键部署演示用。日常开发不需要(app 在 Dev Container 内运行)。
  # 待办:config.json 的中间件 host 是 host.docker.internal(Dev Container 模式),
  # compose 网络内解析会错 —— 一键部署上线前需换服务名配置。
  app:
    build: .
    image: trade-server:latest
    container_name: trade-app
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
