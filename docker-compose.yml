# ============================================================================
# 高可靠交易与对账系统 —— Docker Compose 编排
#
# 两种用法（CLAUDE.md 3.1）：
#   1. 日常开发（推荐）：只拉中间件，app 在 Dev Container 内编译运行
#        docker compose up -d mysql redis rabbitmq
#   2. 一键部署演示：连 app 一起拉起（首次构建约 10~20 分钟）
#        docker compose up -d --build
#
# ⚠️ 改了 sql/ 后要 docker compose down -v 清卷重建：
#    /docker-entrypoint-initdb.d 的初始化脚本只在数据卷为空时执行一次。
# ============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: trade-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Shanghai            # CLAUDE.md 6.7：容器默认 UTC 会让对账错位一天
    command:
      - --default-time-zone=+8:00  # 会话时区：与 app 侧 TZ 对齐（修正 3 的前提）
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d   # schema.sql + seed.sql，卷初始化时执行一次
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    container_name: trade-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: trade-rabbitmq
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # 管理台 http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  # 一键部署演示用。日常开发不需要（app 在 Dev Container 内运行）。
  # compose 网络内 mysql/redis/rabbitmq 服务名可直接解析，config.json 无需改动。
  app:
    build: .
    image: trade-server:latest
    container_name: trade-app
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
